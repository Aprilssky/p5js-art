<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎨 p5.js 作品集</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/material-darker.min.css">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface2: #252525;
    --border: #333;
    --text: #e0e0e0;
    --text2: #888;
    --accent: #7c5cfc;
    --accent2: #5cb8ff;
    --danger: #e05555;
    --radius: 12px;
    --code-bg: #0f0f0f;
    --chat-bg: #131313;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
  }

  .app { height: 100vh; display: flex; flex-direction: column; }
  
  /* Topbar */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 10;
  }
  .topbar .logo {
    font-size: 18px; font-weight: 700; margin-right: auto;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  
  .btn {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text);
    font-size: 14px; cursor: pointer; transition: all 0.2s;
    white-space: nowrap; display: flex; align-items: center; gap: 6px;
    text-decoration: none;
  }
  .btn:hover { background: #333; border-color: #555; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #6b4ef0; }
  .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: var(--danger); color: #fff; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn.icon { padding: 8px; min-width: 36px; justify-content: center; }

  /* ====== Gallery ====== */
  .gallery {
    flex: 1; overflow-y: auto; padding: 24px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px; align-content: start;
  }
  .gallery::-webkit-scrollbar { width: 6px; }
  .gallery::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(124,92,252,0.15); }
  .card-thumb { width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #111; }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card-thumb.placeholder { display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #444; }
  .card .name { padding: 10px 12px 2px; font-size: 14px; font-weight: 600; }
  .card .desc { padding: 0 12px; font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { padding: 8px 12px; font-size: 11px; color: #555; display: flex; justify-content: space-between; }
  .card .actions { padding: 0 12px 10px; display: flex; gap: 6px; }
  .card .btn-edit {
    flex:1; padding:5px; border-radius:6px; border:1px solid var(--border);
    background:transparent; color:var(--text2); font-size:12px; cursor:pointer; transition:all .2s;
  }
  .card .btn-edit:hover { background:var(--surface2); color:var(--text); border-color:var(--accent); }

  .empty-state {
    grid-column: 1 / -1;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 80px 20px; color: var(--text2);
  }
  .empty-state .icon { font-size: 4rem; margin-bottom: 16px; }
  .empty-state .title { font-size: 1.3rem; color: var(--text); margin-bottom: 8px; }
  .empty-state .sub { font-size: 0.9rem; }

  /* ====== Editor ====== */
  .editor { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .editor.active { display: flex; }
  
  .editor-topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .editor-topbar .field-group { display: flex; align-items: center; gap: 8px; }
  .editor-topbar .field-group label { font-size: 12px; color: var(--text2); white-space: nowrap; }
  .editor-topbar input, .editor-topbar textarea {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; color: var(--text); font-size: 13px; width: 200px;
  }
  .editor-topbar textarea { width: 300px; resize: vertical; min-height: 28px; max-height: 60px; }
  .editor-topbar .status-bar { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .status { font-size: 12px; padding: 2px 10px; border-radius: 10px; }
  .status.saved { background: rgba(80,200,80,0.15); color: #4caf50; }
  .status.unsaved { background: rgba(255,200,50,0.15); color: #ffc107; }

  .editor-body { flex: 1; display: flex; overflow: hidden; }

  .code-panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  .code-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0; font-size: 12px; color: var(--text2);
  }
  .code-header .code-actions { display: flex; gap: 6px; }

  /* ===== CodeMirror overrides ===== */
  .CodeMirror {
    flex: 1; height: auto !important;
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px; line-height: 1.6;
    background: var(--code-bg);
    color: #e6e6e6;
  }
  .CodeMirror-gutters {
    background: #0b0b0b !important;
    border-right: 1px solid #222 !important;
  }
  .CodeMirror-linenumber {
    color: #3a3a3a !important;
    padding: 0 8px 0 4px !important;
    font-size: 12px;
  }
  .CodeMirror-activeline-background { background: rgba(124,92,252,0.06) !important; }
  .CodeMirror-activeline-gutter { background: #111 !important; }
  .CodeMirror-matchingbracket {
    outline: 1px solid rgba(124,92,252,0.4) !important;
    color: #fff !important;
    background: rgba(124,92,252,0.15) !important;
  }
  .CodeMirror-selected { background: rgba(124,92,252,0.2) !important; }
  .CodeMirror-focused .CodeMirror-selected { background: rgba(124,92,252,0.25) !important; }
  .cm-s-material-darker .CodeMirror-cursor { border-left: 2px solid var(--accent) !important; }
  .cm-s-material-darker span.cm-keyword { color: #c792ea !important; }
  .cm-s-material-darker span.cm-def { color: #82aaff !important; }
  .cm-s-material-darker span.cm-variable { color: #f07178 !important; }
  .cm-s-material-darker span.cm-variable-2 { color: #f78c6c !important; }
  .cm-s-material-darker span.cm-variable-3 { color: #ffcb6b !important; }
  .cm-s-material-darker span.cm-number { color: #f78c6c !important; }
  .cm-s-material-darker span.cm-string { color: #c3e88d !important; }
  .cm-s-material-darker span.cm-comment { color: #546e7a !important; font-style: italic; }
  .cm-s-material-darker span.cm-builtin { color: #89ddff !important; }

  /* Code folding gutter styling */
  .CodeMirror-foldgutter { width: 16px !important; }
  .CodeMirror-foldgutter-open, .CodeMirror-foldgutter-folded {
    cursor: pointer; font-size: 13px; line-height: 1.6;
    color: #555 !important; transition: color 0.15s;
  }
  .CodeMirror-foldgutter-open:hover, .CodeMirror-foldgutter-folded:hover { color: var(--accent) !important; }
  .CodeMirror-foldgutter-open::after { content: "▾"; color: #555; }
  .CodeMirror-foldgutter-folded::after { content: "▸"; color: #555; }
  .CodeMirror-foldgutter-open:hover::after { color: var(--accent); }
  .CodeMirror-foldgutter-folded:hover::after { color: var(--accent); }
  /* fold marker inside code */
  .CodeMirror-foldmarker {
    color: var(--accent) !important; text-shadow: none !important;
    background: rgba(124,92,252,0.1); border-radius: 3px;
    padding: 0 4px; font-size: 11px; cursor: pointer;
    border: 1px solid rgba(124,92,252,0.25);
  }

  .preview-panel { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; }
  .preview-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0; font-size: 12px; color: var(--text2);
  }
  #previewFrame { flex: 1; width: 100%; border: none; background: #0a0a0a; }

  .resize-handle {
    width: 6px; cursor: col-resize; background: transparent;
    position: relative; flex-shrink: 0; z-index: 5;
  }
  .resize-handle::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: 2px; right: 2px;
    border-radius: 3px; transition: background .2s;
  }
  .resize-handle:hover::after, .resize-handle:active::after { background: var(--accent); }

  /* Fullscreen preview */
  .preview-panel.fullscreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50;
    background: #000;
  }
  .preview-panel.fullscreen .code-header,
  .preview-panel.fullscreen .preview-header { display: flex; }
  .preview-panel.fullscreen .code-header { display: none; }
  .code-panel { display: flex; flex-direction: column; }
  .preview-panel.fullscreen ~ .code-panel { display: none; }

  /* Toast */
  #toast { transition: opacity 0.3s; }

  /* ====== AI Inline Panel (code generation) ====== */
  .ai-inline-panel {
    display: none; flex-shrink: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 12px; gap: 8px; flex-direction: column;
  }
  .ai-inline-panel.open { display: flex; }
  .ai-inline-panel .ai-row {
    display: flex; align-items: flex-start; gap: 8px;
  }
  .ai-inline-panel .ai-row textarea {
    flex: 1; min-height: 36px; max-height: 80px; resize: vertical;
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; color: var(--text);
    font-size: 13px; font-family: inherit;
    outline: none; transition: border-color 0.2s;
    line-height: 1.4;
  }
  .ai-inline-panel .ai-row textarea:focus { border-color: var(--accent); }
  .ai-inline-panel .ai-row textarea::placeholder { color: #555; }
  .ai-inline-panel .ai-actions {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .ai-inline-panel .ai-status-row {
    display: flex; align-items: center; gap: 8px; min-height: 20px;
  }
  .ai-inline-panel .ai-status {
    font-size: 12px; color: var(--text2);
    display: flex; align-items: center; gap: 6px; flex: 1;
  }
  .ai-inline-panel .ai-status .spinner {
    display: none; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: ai-spin 0.6s linear infinite;
  }
  .ai-inline-panel .ai-status.loading .spinner { display: inline-block; }
  @keyframes ai-spin { to { transform: rotate(360deg); } }
  .ai-inline-panel .ai-status.error { color: var(--danger); }
  .ai-inline-panel .ai-status.success { color: #4caf50; }
  .btn-ai-generate {
    padding: 6px 16px; border-radius: 8px; border: none;
    background: linear-gradient(135deg, var(--accent), #6b4ef0);
    color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: opacity 0.2s; white-space: nowrap;
  }
  .btn-ai-generate:hover { opacity: 0.9; }
  .btn-ai-generate:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-ai-settings {
    padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text2); font-size: 12px; cursor: pointer;
    white-space: nowrap; transition: all 0.2s;
  }
  .btn-ai-settings:hover { border-color: var(--accent); color: var(--text); }

  .ai-inline-settings {
    display: none; flex-direction: column; gap: 6px;
    background: var(--surface2); border-radius: 8px;
    padding: 10px 12px;
  }
  .ai-inline-settings.open { display: flex; }
  .ai-inline-settings label {
    font-size: 11px; color: var(--text2); margin-top: 2px;
  }
  .ai-inline-settings input {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; color: var(--text); font-size: 12px;
    font-family: monospace; outline: none;
  }
  .ai-inline-settings input:focus { border-color: var(--accent); }

  /* ====== AI Chat Panel (conversation) ====== */
  .ai-chat-overlay {
    display: none; position: fixed; bottom: 0; right: 0;
    width: 420px; max-width: 100vw; height: 60vh; max-height: 700px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-right: none; border-bottom: none;
    border-radius: 16px 0 0 0;
    z-index: 100;
    flex-direction: column;
    box-shadow: -4px 0 32px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .ai-chat-overlay.open { display: flex; }

  .ai-chat-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: linear-gradient(135deg, var(--surface), var(--surface2));
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .ai-chat-header .title {
    font-size: 14px; font-weight: 600;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .ai-chat-header .title-icon { font-size: 16px; }
  .ai-chat-header .spacer { flex: 1; }
  .ai-chat-header .close-btn {
    background: transparent; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text2); cursor: pointer;
    padding: 3px 8px; font-size: 13px; transition: all 0.15s;
  }
  .ai-chat-header .close-btn:hover { color: var(--text); border-color: var(--text2); }

  .ai-chat-messages {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--chat-bg);
  }
  .ai-chat-messages::-webkit-scrollbar { width: 5px; }
  .ai-chat-messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .chat-msg {
    display: flex; gap: 8px; max-width: 85%;
    animation: chatFadeIn 0.2s ease-out;
  }
  @keyframes chatFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .chat-msg.assistant { align-self: flex-start; }

  .chat-msg .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .chat-msg.user .avatar { background: var(--accent); color: #fff; order: 1; }
  .chat-msg.assistant .avatar { background: #2a2a3a; color: var(--accent2); }

  .chat-msg .bubble {
    padding: 8px 14px; border-radius: 12px;
    font-size: 13px; line-height: 1.55; word-break: break-word;
    position: relative;
  }
  .chat-msg.user .bubble {
    background: var(--accent); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .chat-msg.assistant .bubble {
    background: var(--surface2); color: var(--text);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
  }
  .chat-msg .bubble p { margin: 4px 0; }
  .chat-msg .bubble p:first-child { margin-top: 0; }
  .chat-msg .bubble p:last-child { margin-bottom: 0; }
  .chat-msg .bubble code {
    background: rgba(0,0,0,0.3); padding: 1px 5px; border-radius: 4px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px;
  }
  .chat-msg .bubble pre {
    background: rgba(0,0,0,0.4); border-radius: 8px; padding: 10px 12px;
    margin: 8px 0; overflow-x: auto; font-size: 12px; border: 1px solid rgba(255,255,255,0.05);
  }
  .chat-msg .bubble pre code { background: none; padding: 0; }
  .chat-msg .bubble ul, .chat-msg .bubble ol { margin: 4px 0; padding-left: 20px; }

  .chat-typing {
    align-self: flex-start; display: flex; gap: 8px;
    animation: chatFadeIn 0.2s ease-out;
  }
  .chat-typing .avatar { width: 28px; height: 28px; border-radius: 50%;
    background: #2a2a3a; color: var(--accent2);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; }
  .chat-typing .bubble {
    padding: 10px 16px; border-radius: 12px; border-bottom-left-radius: 4px;
    background: var(--surface2); border: 1px solid var(--border);
    display: flex; align-items: center; gap: 4px;
  }
  .chat-typing .dot { width: 6px; height: 6px; border-radius: 50%;
    background: #555; animation: dotPulse 1.2s infinite ease-in-out; }
  .chat-typing .dot:nth-child(2) { animation-delay: 0.2s; }
  .chat-typing .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotPulse { 0%,60%,100% { background: #555; } 30% { background: var(--accent); } }

  .chat-sys-msg {
    text-align: center; font-size: 11px; color: #555;
    padding: 4px 0; animation: chatFadeIn 0.2s ease-out;
  }

  .ai-chat-input {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: var(--surface); border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .ai-chat-input textarea {
    flex: 1; min-height: 36px; max-height: 80px; resize: vertical;
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; color: var(--text);
    font-size: 13px; font-family: inherit; line-height: 1.4;
    outline: none; transition: border-color 0.2s;
  }
  .ai-chat-input textarea:focus { border-color: var(--accent); }
  .ai-chat-input textarea::placeholder { color: #555; }
  .ai-chat-input .send-btn {
    padding: 8px 14px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff; font-size: 16px; cursor: pointer;
    transition: opacity 0.2s; flex-shrink: 0; min-width: 40px;
    display: flex; align-items: center; justify-content: center;
  }
  .ai-chat-input .send-btn:hover { opacity: 0.85; }
  .ai-chat-input .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .ai-chat-btn-toggle {
    position: fixed; bottom: 20px; right: 20px;
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none; color: #fff; font-size: 22px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(124,92,252,0.35);
    z-index: 99; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .ai-chat-btn-toggle:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(124,92,252,0.5); }
  .ai-chat-btn-toggle.hidden { display: none; }

  @media (max-width: 768px) {
    .editor-body { flex-direction: column; }
    .code-panel { border-right: none; border-bottom: 1px solid var(--border); }
    .resize-handle { display: none; }
    .ai-inline-panel .ai-row { flex-direction: column; }
    .ai-inline-panel .ai-actions { align-self: flex-end; }
    .ai-chat-overlay { width: 100vw; height: 65vh; max-height: 80vh; border-radius: 16px 16px 0 0; }
    .ai-chat-btn-toggle { bottom: 16px; right: 16px; width: 44px; height: 44px; font-size: 20px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- Topbar -->
  <div class="topbar">
    <span class="logo" id="topbarLogo">🎨 p5.js 作品集</span>
    <span class="logo" id="topbarTitle" style="display:none">✏️ </span>
    <button class="btn" id="btnNew" style="display:flex">＋ 新建</button>
    <button class="btn" id="btnImport" style="display:flex" title="从 JSON 文件导入作品">📤 导入</button>
    <button class="btn" id="btnExport" style="display:flex" title="导出全部作品为 JSON">📥 导出</button>
    <button class="btn" id="btnBack" style="display:none">← 返回</button>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importJSON(event)">
  </div>

  <!-- Gallery View -->
  <div class="gallery" id="gallery"></div>

  <!-- Editor View -->
  <div class="editor" id="editor">
    <div class="editor-topbar">
      <div class="field-group">
        <label>作品名</label>
        <input type="text" id="nameInput" placeholder="未命名作品" maxlength="60">
      </div>
      <div class="field-group">
        <label>描述</label>
        <textarea id="descInput" placeholder="简短描述..." rows="1"></textarea>
      </div>
      <div class="status-bar">
        <span class="status saved" id="statusMsg">✅ 已保存</span>
        <button class="btn small primary" id="btnSave">💾 保存</button>
        <button class="btn small danger" id="btnDelete">🗑️</button>
      </div>
    </div>

    <div class="editor-body">

<script>
// ============ LocalStorage 数据层 ============
const STORAGE_KEY = 'p5js_portfolio';
const CHAT_STORAGE_KEY = '_p5chat_msgs';

// ===== 内置示例模板 =====
const TEMPLATES = {
  '🌀 旋转风扇': `function setup() {
  createCanvas(400, 400);
  angleMode(DEGREES);
  colorMode(HSB, 360, 255, 255);
}

function draw() {
  background(20, 20, 30, 40);
  translate(width / 2, height / 2);
  let angle = frameCount * 3;
  push(); fill(60); noStroke();
  rect(-8, 80, 16, 120, 3); rect(-60, 180, 120, 20, 5); pop();
  push(); fill(80); stroke(120); strokeWeight(2);
  circle(0, 0, 40); fill(40); circle(0, 0, 16);
  fill(200, 180, 50); circle(0, 0, 6); pop();
  for (let i = 0; i < 4; i++) {
    push(); rotate(angle + i * 90);
    let hue = (frameCount * 0.5 + i * 90) % 360;
    fill(hue, 200, 255, 180); noStroke();
    beginShape(); vertex(0, 0);
    bezierVertex(30, -30, 100, -60, 130, -30);
    bezierVertex(140, -15, 130, 5, 90, 10);
    bezierVertex(50, 15, 15, 5, 0, 0); endShape(CLOSE);
    fill(255, 255, 255, 40);
    beginShape(); vertex(10, -5);
    bezierVertex(30, -25, 70, -40, 90, -25);
    bezierVertex(70, -20, 35, -10, 10, -5); endShape(CLOSE);
    pop();
  }
  push(); noFill();
  stroke(100, 200, 255, 30 + 20 * sin(frameCount * 2));
  strokeWeight(1);
  circle(0, 0, (130 + 10 * sin(frameCount * 1.5)) * 2);
  pop();
}`,
  '🌊 动态波浪': `let cols, rows;
let scl = 20;
let flying = 0;

function setup() {
  createCanvas(400, 400, WEBGL);
}

function draw() {
  background(10);
  flying -= 0.05;
  let yoff = flying;
  
  rotateX(PI / 3);
  translate(-width / 2, -height / 2);
  
  strokeWeight(1);
  for (let y = 0; y <= height; y += scl) {
    beginShape(TRIANGLE_STRIP);
    let xoff = 0;
    for (let x = 0; x <= width; x += scl) {
      let h = map(noise(xoff, yoff), 0, 1, -80, 80);
      let r = map(x, 0, width, 100, 255);
      let g = map(h, -80, 80, 50, 200);
      let b = map(y, 0, height, 255, 100);
      stroke(r, g, b, 180);
      vertex(x, y, h);
      xoff += 0.1;
      h = map(noise(xoff, yoff + 0.05), 0, 1, -80, 80);
      vertex(x, y + scl, h);
    }
    endShape();
    yoff += 0.1;
  }
}`,
  '✨ 粒子星云': `let particles = [];

function setup() {
  createCanvas(400, 400);
  for (let i = 0; i < 200; i++) {
    particles.push(new Particle());
  }
}

function draw() {
  background(10, 10, 20, 20);
  translate(width / 2, height / 2);
  for (let p of particles) {
    p.update();
    p.show();
  }
}

class Particle {
  constructor() {
    this.angle = random(TWO_PI);
    this.radius = random(50, 200);
    this.speed = random(0.002, 0.01);
    this.size = random(1, 4);
    this.hue = random(360);
  }
  update() {
    this.angle += this.speed;
    this.radius += random(-0.5, 0.5) * 0.3;
    this.radius = constrain(this.radius, 20, 220);
  }
  show() {
    let x = cos(this.angle) * this.radius;
    let y = sin(this.angle) * this.radius;
    let alpha = map(this.radius, 20, 220, 200, 50);
    colorMode(HSB, 360, 255, 255, 255);
    fill(this.hue, 200, 255, alpha);
    noStroke();
    circle(x, y, this.size);
    colorMode(RGB, 255);
  }
}`,
  '🎨 彩色螺旋': `function setup() {
  createCanvas(400, 400);
  colorMode(HSB, 360, 255, 255);
  noFill();
}

function draw() {
  background(10, 10, 10, 30);
  translate(width / 2, height / 2);
  
  let t = frameCount * 0.02;
  let n = 300;
  
  beginShape();
  for (let i = 0; i < n; i++) {
    let angle = i * radians(15) + t * 3;
    let r = 3 + i * 0.6 + 30 * sin(t + i * 0.05);
    let x = cos(angle) * r;
    let y = sin(angle) * r;
    stroke((i + frameCount) % 360, 200, 255, 150);
    strokeWeight(1.5);
    vertex(x, y);
    // 加小圆点
    point(x + cos(angle + 0.5) * 5, y + sin(angle + 0.5) * 5);
  }
  endShape();
}`
};

const DEFAULT_FAN_CODE = TEMPLATES['🌀 旋转风扇'];

function seedDefaultArtworks(artworks) {
  if (artworks.length > 0) return artworks;
  const defaults = [
    {
      id: genId(),
      name: '🌀 旋转风扇',
      description: '4片动态炫彩风扇，带拖尾效果和旋转光圈',
      code: DEFAULT_FAN_CODE,
      thumbnail: null,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    }
  ];
  saveData(defaults);
  return defaults;
}

function loadData() {
  try {
    let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    data = seedDefaultArtworks(data);
    return data;
  } catch(e) {
    const seeded = seedDefaultArtworks([]);
    return seeded;
  }
}

function saveData(artworks) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(artworks));
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// ============ State ============
const state = {
  artworks: [],
  currentId: null,
  currentCode: '',
  currentName: '',
  currentDesc: '',
  saved: true,
  view: 'gallery'
};

// ============ CodeMirror Editor ============
let cmEditor = null;

function initCodeMirror() {
  const textarea = document.getElementById('codeEditor');
  cmEditor = CodeMirror.fromTextArea(textarea, {
    mode: 'javascript',
    theme: 'material-darker',
    lineNumbers: true,
    lineWrapping: false,
    tabSize: 2,
    indentUnit: 2,
    indentWithTabs: false,
    smartIndent: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    styleActiveLine: true,
    foldGutter: true,
    gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
    extraKeys: {
      "Ctrl-Q": function(cm) { cm.foldCode(cm.getCursor()); },
      "Cmd-Q": function(cm) { cm.foldCode(cm.getCursor()); },
      "Ctrl-`": function(cm) { cm.foldAll(); },
      "Cmd-`": function(cm) { cm.foldAll(); },
      "Shift-Ctrl-`": function(cm) { cm.unfoldAll(); },
      "Shift-Cmd-`": function(cm) { cm.unfoldAll(); },
      "Ctrl-Space": "autocomplete",
      "Tab": function(cm) {
        if (cm.somethingSelected()) cm.indentSelection("add");
        else cm.replaceSelection("  ", "end");
      }
    },
    foldOptions: {
      widget: function(from, to) {
        var count = cmEditor.lineCount();
        var inner = to.line - from.line;
        return '\u00a0\u00a0\ue000 ' + inner + ' 行\u00a0\u00a0';
      }
    }
  });

  // Sync CodeMirror changes to state
  cmEditor.on('change', function() {
    state.saved = false;
    state.currentCode = cmEditor.getValue();
    updateStatus();
    updateLineCount();
    
    clearTimeout(previewTimer);
    previewTimer = setTimeout(runPreview, 800);
  });

  // Handle focus for keyboard shortcuts
  cmEditor.on('focus', function() {
    // ensure cm has focus for keyboard shortcut handling
  });

  updateLineCount();
}

// Helper to get/set code from CM
function getEditorCode() {
  return cmEditor ? cmEditor.getValue() : document.getElementById('codeEditor').value;
}

function setEditorCode(code) {
  if (cmEditor) {
    cmEditor.setValue(code);
  } else {
    document.getElementById('codeEditor').value = code;
  }
}

// ============ DOM Refs ============
const $ = (s) => document.querySelector(s);
const gallery = $('#gallery');
const editor = $('#editor');
const codeEditorEl = $('#codeEditor');
const nameInput = $('#nameInput');
const descInput = $('#descInput');
const previewFrame = $('#previewFrame');
const statusMsg = $('#statusMsg');
const lineCount = $('#lineCount');
const topbarLogo = $('#topbarLogo');
const topbarTitle = $('#topbarTitle');
const btnNew = $('#btnNew');
const btnBack = $('#btnBack');
const btnSave = $('#btnSave');
const btnDelete = $('#btnDelete');

// ============ Gallery ============
function loadGallery() {
  state.artworks = loadData();
  renderGallery();
}

function renderGallery() {
  if (state.artworks.length === 0) {
    gallery.innerHTML = `
      <div class="empty-state">
        <div class="icon">🎨</div>
        <div class="title">还没有作品</div>
        <div class="sub">点击「＋ 新建」创建第一个 p5.js 艺术作品</div>
      </div>`;
    return;
  }

  gallery.innerHTML = state.artworks.map(a => {
    const date = new Date(a.updatedAt);
    const timeAgo = formatTime(date);
    const thumbHtml = a.thumbnail
      ? `<div class="card-thumb"><img src="${a.thumbnail}" alt="预览" loading="lazy"></div>`
      : `<div class="card-thumb placeholder"><span>🎨</span></div>`;
    return `
      <div class="card" onclick="openEditor('${a.id}')">
        ${thumbHtml}
        <div class="name">${esc(a.name)}</div>
        <div class="desc">${esc(a.description || '暂无描述')}</div>
        <div class="meta">
          <span>${timeAgo}</span>
          <span style="color:var(--accent);font-size:11px">p5.js</span>
        </div>
        <div class="actions">
          <button class="btn-edit" onclick="event.stopPropagation(); openEditor('${a.id}')">✏️ 编辑</button>
          <button class="btn-edit" onclick="event.stopPropagation(); openViewer('${a.id}')">↗ 查看</button>
          <button class="btn-edit" onclick="event.stopPropagation(); cloneArtwork('${a.id}')">📋 克隆</button>
        </div>
      </div>`;
  }).join('');
}

function formatTime(d) {
  const now = new Date();
  const diff = now - d;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + '分钟前';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + '小时前';
  const days = Math.floor(hours / 24);
  if (days < 30) return days + '天前';
  return d.toLocaleDateString('zh-CN');
}

function esc(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function openViewer(id) {
  const art = state.artworks.find(a => a.id === id);
  if (!art) return;
  const viewerKey = 'p5js_viewer_' + id;
  localStorage.setItem(viewerKey, JSON.stringify({
    name: art.name,
    code: art.code
  }));
  window.open('viewer.html?id=' + id, '_blank');
}

// ===== 导出 / 导入 =====
function exportJSON() {
  const data = loadData();
  const now = new Date();
  const stamp = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'p5js-artworks-' + stamp + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('数据格式错误');
      data.forEach((item, i) => {
        if (!item.id || typeof item.code !== 'string') {
          throw new Error('第 ' + (i + 1) + ' 项缺少 id 或 code 字段');
        }
      });
      const existing = loadData();
      const mergeExisting = state.view === 'editor'
        ? existing
        : [];
      const useMerge = state.view === 'editor' &&
        confirm('当前在编辑视图，选择「确定」合并导入（保留现有数据），「取消」则替换全部');
      const finalData = useMerge
        ? [...existing, ...data]
        : data;
      saveData(finalData);
      state.artworks = finalData;
      showGallery();
      loadGallery();
      showToast('✅ 导入成功，共 ' + finalData.length + ' 个作品');
    } catch(err) {
      alert('导入失败: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===== 克隆作品 =====
function cloneArtwork(id) {
  const art = state.artworks.find(a => a.id === id);
  if (!art) return;
  const clone = {
    id: genId(),
    name: art.name + ' (副本)',
    description: art.description,
    code: art.code,
    thumbnail: null,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  state.artworks.push(clone);
  saveData(state.artworks);
  renderGallery();
  showToast('📋 已克隆「' + art.name + '」');
}

// ===== 模板加载 =====
function loadTemplate(name) {
  const code = TEMPLATES[name];
  if (!code) return;
  setEditorCode(code);
  state.currentCode = code;
  state.saved = false;
  updateStatus();
  updateLineCount();
  runPreview();
  showToast('📦 已加载模板: ' + name);
}

// ===== 全屏预览 =====
function toggleFullscreen() {
  const previewPanel = $('#previewPanel');
  if (previewPanel.classList.contains('fullscreen')) {
    previewPanel.classList.remove('fullscreen');
    document.body.style.overflow = '';
  } else {
    previewPanel.classList.add('fullscreen');
    document.body.style.overflow = 'hidden';
  }
}

// ===== Toast 消息 =====
function showToast(msg, duration) {
  duration = duration || 2000;
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.cssText = 'position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--surface2); color: var(--text); padding: 10px 20px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; z-index: 9999; box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: opacity 0.3s; opacity: 1;';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, duration);
}

// ============ Editor ============
let previewReady = false;

function openEditor(id) {
  const art = state.artworks.find(a => a.id === id);
  if (!art) return;
  
  state.currentId = art.id;
  state.currentCode = art.code;
  state.currentName = art.name;
  state.currentDesc = art.description || '';
  state.saved = true;
  
  nameInput.value = art.name;
  descInput.value = art.description || '';
  setEditorCode(art.code);
  
  showEditor();
  navigateTo('?edit=' + id);
  updateLineCount();
  updateStatus();
  runPreview();
  
  // Show the chat toggle button when in editor
  $('#aiChatToggleBtn').classList.remove('hidden');
}

function createArtwork() {
  const tmplNames = Object.keys(TEMPLATES);
  const defaultCode = tmplNames[Math.floor(Math.random() * tmplNames.length)];
  const art = {
    id: genId(),
    name: '未命名作品',
    description: '',
    code: TEMPLATES[defaultCode] || '',
    thumbnail: null,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  state.artworks.push(art);
  saveData(state.artworks);
  openEditor(art.id);
  renderGallery();
  showToast('🎨 已创建新作品（随机模板）');
}

function saveArtwork() {
  if (!state.currentId) return;
  
  state.currentName = nameInput.value.trim() || '未命名作品';
  state.currentDesc = descInput.value.trim();
  state.currentCode = getEditorCode();
  
  const idx = state.artworks.findIndex(a => a.id === state.currentId);
  if (idx !== -1) {
    state.artworks[idx].name = state.currentName;
    state.artworks[idx].description = state.currentDesc;
    state.artworks[idx].code = state.currentCode;
    state.artworks[idx].updatedAt = new Date().toISOString();
    saveData(state.artworks);
  }
  
  state.saved = true;
  updateStatus();
  renderGallery();
}

function deleteArtwork() {
  if (!state.currentId) return;
  if (!confirm('确定要删除「' + (state.currentName || '未命名作品') + '」吗？此操作不可撤销。')) return;
  
  state.artworks = state.artworks.filter(a => a.id !== state.currentId);
  saveData(state.artworks);
  state.currentId = null;
  showGallery();
  loadGallery();
}

// ===== View switching =====
function showGallery() {
  state.view = 'gallery';
  gallery.style.display = '';
  editor.classList.remove('active');
  btnNew.style.display = '';
  btnBack.style.display = 'none';
  topbarLogo.style.display = '';
  topbarTitle.style.display = 'none';
  document.title = '🎨 p5.js 作品集';
  navigateTo('.');
  renderGallery();
  // Hide chat toggle when not in editor
  $('#aiChatToggleBtn').classList.add('hidden');
  // Close chat overlay if open
  closeChatPanel();
}

function showEditor() {
  state.view = 'editor';
  gallery.style.display = 'none';
  editor.classList.add('active');
  btnNew.style.display = 'none';
  btnBack.style.display = 'flex';
  topbarLogo.style.display = 'none';
  topbarTitle.style.display = 'inline';
  topbarTitle.textContent = '✏️ ' + state.currentName;

function _enc(t) { return btoa(t.split('').reverse().join('')); }
function _dec(s) { try { return atob(s).split('').reverse().join(''); } catch(e) { return ''; } }

function loadAiConfig() {
  try {
    const raw = localStorage.getItem(AI_STORAGE_KEY);
    if (raw) return JSON.parse(_dec(raw));
  } catch(e) {}
  return { endpoint: 'https://api.deepseek.com/chat/completions', key: '', model: 'deepseek-v4-flash' };
}

function saveAiConfig(cfg) {
  try { localStorage.setItem(AI_STORAGE_KEY, _enc(JSON.stringify(cfg))); } catch(e) {}
}

    : `你是一个 p5.js 创意编程专家。

规则：
1. 返回纯 JavaScript 代码，不要包含 markdown 代码块标记

  try {

const chatOverlay = $('#aiChatOverlay');

const chatMessages = $('#chatMessages');
const chatInput = $('#chatInput');
const chatSendBtn = $('#chatSendBtn');

// System prompt for the chat evaluation AI
const CHAT_SYSTEM_PROMPT = `你是一位专业的创意编程 / 数字艺术顾问。你的角色是：

1. **评价与分析**：对用户当前 p5.js 作品从视觉效果、色彩搭配、构图、动感、交互性、创意性等角度给出诚恳的评价
2. **改进建议**：针对作品中可以优化的部分给出具体、可操作的建议（配色、动画曲线、粒子效果、交互方式等）
3. **创作方向**：根据用户描述，帮他们探索和拓展创作方向，提供灵感启发
4. **技术指导**：解释某些效果如何用 p5.js 实现，给出代码思路（但不需要给出完整代码）

对话风格：
- 有温度，像一位懂艺术的朋友
- 坦诚，不盲目吹捧，也不过于严厉
- 多提具体的、建设性的意见
- 能追问细节，引导用户深入思考自己的创作

当前用户正在编辑的作品名称、描述和代码上下文会在每次对话时附上。请你基于这些上下文给出有针对性的回应。`;

function loadChatMessages() {
  try {
    const raw = localStorage.getItem(CHAT_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return [];
}

function saveChatMessages(msgs) {
  try { localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(msgs.slice(-50))); } catch(e) {}
}

function renderChatMessages() {
  const msgs = loadChatMessages();
  chatMessages.innerHTML = '';
  
  if (msgs.length === 0) {
    chatMessages.innerHTML = '<div class="chat-sys-msg">💡 和 AI 讨论当前作品的创作方向，获取评价和改进建议。</div>';
    return;
  }
  
  msgs.forEach(m => {
    appendMessageToDOM(m.role, m.content, false);
  });
  scrollChatToBottom();
}

function appendMessageToDOM(role, content, animate) {
  // Remove the system tip if it exists and we have real messages
  const sysMsg = chatMessages.querySelector('.chat-sys-msg');
  if (sysMsg) sysMsg.remove();
  
  const div = document.createElement('div');
  div.className = 'chat-msg ' + role;
  if (!animate) div.style.animation = 'none';
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '👤' : '🤖';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  
  // Simple markdown-like rendering
  bubble.innerHTML = renderMarkdown(content);
  
  div.appendChild(avatar);
  div.appendChild(bubble);
  chatMessages.appendChild(div);
}

function renderMarkdown(text) {
  // Escape HTML first
  let html = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  
  // Code blocks (``` ... ```)
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, function(match, lang, code) {
    return '<pre><code>' + code.trim() + '</code></pre>';
  });
  
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  
  // Bold and italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  
  // Line breaks (double for paragraphs)
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  
  // Wrap in paragraph if not already wrapped with block-level elements
  if (!html.startsWith('<pre') && !html.startsWith('<p>')) {
    html = '<p>' + html + '</p>';
  }
  
  // Fix consecutive <br> at start/end
  html = html.replace(/^<p><br>/g, '<p>');
  html = html.replace(/<br><\/p>$/g, '</p>');
  
  return html;
}

function scrollChatToBottom() {
  setTimeout(() => {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }, 50);
}

function addChatMessage(role, content) {
  const msgs = loadChatMessages();
  msgs.push({ role, content, timestamp: Date.now() });
  saveChatMessages(msgs);
  appendMessageToDOM(role, content, true);
  scrollChatToBottom();
}

  chatMessages.appendChild(div);
  scrollChatToBottom();
}

function hideTypingIndicator() {
  const el = document.getElementById('chatTypingIndicator');
  if (el) el.remove();
}

function openChatPanel() {
  chatOverlay.classList.add('open');
  chatToggleBtn.classList.add('hidden');
  renderChatMessages();
  setTimeout(() => chatInput.focus(), 200);
}

function closeChatPanel() {
  chatOverlay.classList.remove('open');
  if (state.view === 'editor') {
    chatToggleBtn.classList.remove('hidden');
  }

// Convert chat messages to API format
function buildChatApiMessages() {
  const msgs = loadChatMessages();
  const currentCode = getEditorCode();
  const currentName = nameInput.value.trim() || '未命名作品';
  const currentDesc = descInput.value.trim() || '无描述';
  
  // Context about current work
  const contextMsg = `用户当前正在编辑的作品：
- 名称：${currentName}
- 描述：${currentDesc}

当前代码：
\`\`\`javascript
${currentCode || '(空白的画布，还没有代码)'}
\`\`\``;
  
  const apiMessages = [
    { role: 'system', content: CHAT_SYSTEM_PROMPT + '\n\n' + contextMsg }
  ];
  
  // Add last N messages for context (up to last 20)
  const recentMsgs = msgs.slice(-20);
  recentMsgs.forEach(m => {
    apiMessages.push({ role: m.role, content: m.content });
  });
  
  return apiMessages;
}

async function sendChatMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  
  // Disable UI
  chatInput.value = '';
  chatSendBtn.disabled = true;
  chatInput.disabled = true;
  chatInput.style.height = 'auto';
  
  // Add user message
  addChatMessage('user', text);
  
  // Get AI config
  const cfg = loadAiConfig();
  const endpoint = cfg.endpoint || 'https://api.deepseek.com/chat/completions';
  const apiKey = cfg.key || '';
  const model = cfg.model || 'deepseek-v4-flash';
  
  if (!apiKey) {
    addChatMessage('assistant', '⚠️ 请先设置 API Key。点击代码面板里的 **🤖 AI 生成** → ⚙️，填好 API Key 即可使用。');
    chatSendBtn.disabled = false;
    chatInput.disabled = false;
    chatInput.focus();
    return;
  }
  
  // Show typing
  showTypingIndicator();
  
  try {
    const messages = buildChatApiMessages();
    
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model: model,
        max_tokens: 4096,
        messages: messages
      })
    });
    
    if (!response.ok) {
      const errText = await response.text();
      throw new Error('API 错误 (' + response.status + '): ' + errText.slice(0, 200));
    }
    
    const data = await response.json();
    const reply = data.choices?.[0]?.message?.content || '';
    
    if (!reply) throw new Error('AI 返回内容为空');
    
    hideTypingIndicator();
    addChatMessage('assistant', reply);
    
    // Save config (key might have been updated)
    saveCurrentAiConfig();
    
  } catch (err) {
    hideTypingIndicator();
    addChatMessage('assistant', '❌ 出错啦: ' + err.message);
  } finally {
    chatSendBtn.disabled = false;
    chatInput.disabled = false;
    chatInput.focus();
  }
}

// ===== Fold all / unfold all with gutter click hints =====
// Enable code folding via foldCode addon
CodeMirror.defineExtension("foldAll", function() {
  for (var i = 0; i < this.lineCount(); i++) {
    try { this.foldCode({line: i, ch: 0}); } catch(e) {}
  }
});
CodeMirror.defineExtension("unfoldAll", function() {
  for (var i = 0; i < this.lineCount(); i++) {
    try { this.unfoldCode({line: i, ch: 0}); } catch(e) {}
  }
});
