<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎨 p5.js 作品集</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface2: #252525;
    --border: #333;
    --text: #e0e0e0;
    --text2: #888;
    --accent: #7c5cfc;
    --accent2: #5cb8ff;
    --danger: #e05555;
    --radius: 12px;
    --code-bg: #0f0f0f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
  }

  .app { height: 100vh; display: flex; flex-direction: column; }
  
  /* Topbar */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 10;
  }
  .topbar .logo {
    font-size: 18px; font-weight: 700; margin-right: auto;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  
  .btn {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text);
    font-size: 14px; cursor: pointer; transition: all 0.2s;
    white-space: nowrap; display: flex; align-items: center; gap: 6px;
    text-decoration: none;
  }
  .btn:hover { background: #333; border-color: #555; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #6b4ef0; }
  .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: var(--danger); color: #fff; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn.icon { padding: 8px; min-width: 36px; justify-content: center; }

  /* ====== Gallery ====== */
  .gallery {
    flex: 1; overflow-y: auto; padding: 24px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px; align-content: start;
  }
  .gallery::-webkit-scrollbar { width: 6px; }
  .gallery::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(124,92,252,0.15); }
  .card-thumb { width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #111; }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card-thumb.placeholder { display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #444; }
  .card .name { padding: 10px 12px 2px; font-size: 14px; font-weight: 600; }
  .card .desc { padding: 0 12px; font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { padding: 8px 12px; font-size: 11px; color: #555; display: flex; justify-content: space-between; }
  .card .actions { padding: 0 12px 10px; display: flex; gap: 6px; }
  .card .btn-edit {
    flex:1; padding:5px; border-radius:6px; border:1px solid var(--border);
    background:transparent; color:var(--text2); font-size:12px; cursor:pointer; transition:all .2s;
  }
  .card .btn-edit:hover { background:var(--surface2); color:var(--text); border-color:var(--accent); }

  .empty-state {
    grid-column: 1 / -1;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 80px 20px; color: var(--text2);
  }
  .empty-state .icon { font-size: 4rem; margin-bottom: 16px; }
  .empty-state .title { font-size: 1.3rem; color: var(--text); margin-bottom: 8px; }
  .empty-state .sub { font-size: 0.9rem; }

  /* ====== Editor ====== */
  .editor { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .editor.active { display: flex; }
  
  .editor-topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .editor-topbar .field-group { display: flex; align-items: center; gap: 8px; }
  .editor-topbar .field-group label { font-size: 12px; color: var(--text2); white-space: nowrap; }
  .editor-topbar input, .editor-topbar textarea {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; color: var(--text); font-size: 13px; width: 200px;
  }
  .editor-topbar textarea { width: 300px; resize: vertical; min-height: 28px; max-height: 60px; }
  .editor-topbar .status-bar { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .status { font-size: 12px; padding: 2px 10px; border-radius: 10px; }
  .status.saved { background: rgba(80,200,80,0.15); color: #4caf50; }
  .status.unsaved { background: rgba(255,200,50,0.15); color: #ffc107; }

  .editor-body { flex: 1; display: flex; overflow: hidden; }

  .code-panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  .code-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0; font-size: 12px; color: var(--text2);
  }
  .code-header .code-actions { display: flex; gap: 6px; }
  #codeEditor {
    flex:1; width:100%; background: var(--code-bg); color: #e6e6e6;
    border: none; outline: none; padding: 16px; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 13px; line-height: 1.6; resize: none; tab-size: 2;
  }

  .preview-panel { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; }
  .preview-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0; font-size: 12px; color: var(--text2);
  }
  #previewFrame { flex: 1; width: 100%; border: none; background: #0a0a0a; }

  .resize-handle {
    width: 6px; cursor: col-resize; background: transparent;
    position: relative; flex-shrink: 0; z-index: 5;
  }
  .resize-handle::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: 2px; right: 2px;
    border-radius: 3px; transition: background .2s;
  }
  .resize-handle:hover::after, .resize-handle:active::after { background: var(--accent); }

  /* Fullscreen preview */
  .preview-panel.fullscreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50;
    background: #000;
  }
  .preview-panel.fullscreen .code-header,
  .preview-panel.fullscreen .preview-header { display: flex; }
  .preview-panel.fullscreen .code-header { display: none; }
  .code-panel { display: flex; flex-direction: column; }
  .preview-panel.fullscreen ~ .code-panel { display: none; }

  /* Toast */
  #toast { transition: opacity 0.3s; }

  /* ====== AI Dialog ====== */
  .ai-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
  }
  .ai-overlay.active { display: flex; }
  .ai-dialog {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; width: 520px; max-width: 90vw;
    box-shadow: 0 16px 48px rgba(0,0,0,0.6); overflow: hidden;
  }
  .ai-dialog-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .ai-dialog-header h3 {
    font-size: 15px; font-weight: 600;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .ai-dialog-close {
    background: none; border: none; color: var(--text2);
    font-size: 20px; cursor: pointer; padding: 0 4px;
  }
  .ai-dialog-close:hover { color: var(--text); }
  .ai-dialog-body { padding: 16px 18px; }
  .ai-dialog-body label {
    font-size: 12px; color: var(--text2); display: block; margin-bottom: 6px;
  }
  .ai-dialog-body textarea {
    width: 100%; height: 80px; resize: vertical;
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; color: var(--text);
    font-size: 13px; font-family: inherit;
    outline: none; transition: border-color 0.2s;
  }
  .ai-dialog-body textarea:focus { border-color: var(--accent); }
  .ai-dialog-body textarea::placeholder { color: #555; }
  .ai-dialog-footer {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; border-top: 1px solid var(--border);
  }
  .ai-status {
    flex: 1; font-size: 12px; color: var(--text2);
    display: flex; align-items: center; gap: 6px;
  }
  .ai-status .spinner {
    display: none; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: ai-spin 0.6s linear infinite;
  }
  .ai-status.loading .spinner { display: inline-block; }
  @keyframes ai-spin { to { transform: rotate(360deg); } }
  .ai-status.error { color: var(--danger); }
  .ai-status.success { color: #4caf50; }
  .btn-ai {
    padding: 8px 20px; border-radius: 8px; border: none;
    background: linear-gradient(135deg, var(--accent), #6b4ef0);
    color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity 0.2s;
  }
  .btn-ai:hover { opacity: 0.9; }
  .btn-ai:disabled { opacity: 0.4; cursor: not-allowed; }

  .ai-diff-preview {
    margin-top: 12px; max-height: 200px; overflow-y: auto;
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 12px; line-height: 1.5; white-space: pre-wrap;
    color: #b8b8b8; display: none;
  }
  .ai-diff-preview.show { display: block; }

  details.ai-settings {
    margin-top: 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface2);
  }
  details.ai-settings summary {
    padding: 8px 12px; cursor: pointer; font-size: 12px; color: var(--text2);
    user-select: none;
  }
  details.ai-settings summary:hover { color: var(--text); }
  details.ai-settings[open] { border-color: var(--accent); }
  .ai-settings-body {
    padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 6px;
  }
  .ai-settings-body label {
    font-size: 11px; color: var(--text2); margin-bottom: 0; margin-top: 4px;
  }
  .ai-settings-body input {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; color: var(--text); font-size: 13px;
    font-family: monospace; outline: none;
  }
  .ai-settings-body input:focus { border-color: var(--accent); }

  .btn-ai-apply {
    padding: 8px 20px; border-radius: 8px; border: 1px solid var(--accent);
    background: transparent; color: var(--accent); font-size: 13px;
    cursor: pointer; display: none;
  }
  .btn-ai-apply:hover { background: var(--accent); color: #fff; }
  .btn-ai-apply.show { display: inline-block; }

  @media (max-width: 768px) {
    .editor-body { flex-direction: column; }
    .code-panel { border-right: none; border-bottom: 1px solid var(--border); }
    .resize-handle { display: none; }
    .ai-dialog { width: 100%; max-width: 100%; border-radius: 0; }
    .ai-overlay { align-items: flex-end; }
    .ai-dialog { border-radius: 16px 16px 0 0; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- Topbar -->
  <div class="topbar">
    <span class="logo" id="topbarLogo">🎨 p5.js 作品集</span>
    <span class="logo" id="topbarTitle" style="display:none">✏️ </span>
    <button class="btn" id="btnNew" style="display:flex">＋ 新建</button>
    <button class="btn" id="btnImport" style="display:flex" title="从 JSON 文件导入作品">📤 导入</button>
    <button class="btn" id="btnExport" style="display:flex" title="导出全部作品为 JSON">📥 导出</button>
    <button class="btn" id="btnBack" style="display:none">← 返回</button>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importJSON(event)">
  </div>

  <!-- Gallery View -->
  <div class="gallery" id="gallery"></div>

  <!-- Editor View -->
  <div class="editor" id="editor">
    <div class="editor-topbar">
      <div class="field-group">
        <label>作品名</label>
        <input type="text" id="nameInput" placeholder="未命名作品" maxlength="60">
      </div>
      <div class="field-group">
        <label>描述</label>
        <textarea id="descInput" placeholder="简短描述..." rows="1"></textarea>
      </div>
      <div class="status-bar">
        <span class="status saved" id="statusMsg">✅ 已保存</span>
        <button class="btn small primary" id="btnSave">💾 保存</button>
        <button class="btn small danger" id="btnDelete">🗑️</button>
      </div>
    </div>

    <div class="editor-body">
      <div class="code-panel" id="codePanel" style="flex:1">
        <div class="code-header">
          <span>代码 <span id="lineCount">行: 0</span></span>
          <div class="code-actions">
            <button class="btn small" id="btnTemplate">📦 模板</button>
            <button class="btn small" id="btnAiEdit" style="background:linear-gradient(135deg,var(--accent),#6b4ef0);color:#fff;border-color:transparent" title="AI 修改代码">🤖 AI</button>
            <button class="btn small" id="btnPasteCode">📋 粘贴</button>
            <button class="btn small" id="btnClearCode">🗑️ 清空</button>
            <button class="btn small" id="btnRefresh">🔄 刷新</button>
          </div>
        </div>
        <textarea id="codeEditor" spellcheck="false" placeholder="// 在这里写 p5.js 代码...&#10;function setup() {&#10;  createCanvas(400, 400);&#10;}&#10;&#10;function draw() {&#10;  background(30);&#10;  fill(255, 0, 100);&#10;  ellipse(mouseX, mouseY, 50);&#10;}"></textarea>
      </div>
      <div class="resize-handle" id="resizeHandle"></div>
      <div class="preview-panel" id="previewPanel">
        <div class="preview-header">
          <span>🎬 预览</span>
          <button class="btn small" id="btnFullscreen" title="全屏预览">⛶ 全屏</button>
          <button class="btn small" id="btnEditorPreview" title="在查看器中打开">↗ 查看器</button>
        </div>
        <iframe id="previewFrame" src="preview-template.html" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>
  </div>
</div>

<!-- AI 修改对话框 -->
<div class="ai-overlay" id="aiOverlay">
  <div class="ai-dialog">
    <div class="ai-dialog-header">
      <h3>🤖 AI 修改代码</h3>
      <button class="ai-dialog-close" id="aiClose">✕</button>
    </div>
    <div class="ai-dialog-body">
      <label>输入修改方向，AI 会读取当前代码生成新版本：</label>
      <textarea id="aiPrompt" placeholder="例如：把背景改成渐变色&#10;增加粒子数量到 500&#10;画成 3D 效果&#10;添加鼠标交互"></textarea>
      <div class="ai-diff-preview" id="aiDiffPreview"></div>
      <details class="ai-settings" id="aiSettings">
        <summary>⚙️ API 设置</summary>
        <div class="ai-settings-body">
          <label>API Endpoint</label>
          <input type="text" id="aiEndpoint" value="https://api.deepseek.com/anthropic/v1/messages">
          <label>API Key</label>
          <input type="password" id="aiApiKey" placeholder="sk-...">
          <label>模型</label>
          <input type="text" id="aiModel" value="deepseek-v4-flash">
        </div>
      </details>
    </div>
    <div class="ai-dialog-footer">
      <div class="ai-status" id="aiStatus">
        <span class="spinner"></span>
        <span id="aiStatusText">就绪</span>
      </div>
      <button class="btn-ai-apply" id="aiApplyBtn">✅ 应用代码</button>
      <button class="btn-ai" id="aiGenerateBtn">✨ 生成</button>
    </div>
  </div>
</div>

<script>
// ============ LocalStorage 数据层 ============
const STORAGE_KEY = 'p5js_portfolio';

// ===== 内置示例模板 =====
const TEMPLATES = {
  '🌀 旋转风扇': `function setup() {
  createCanvas(400, 400);
  angleMode(DEGREES);
  colorMode(HSB, 360, 255, 255);
}

function draw() {
  background(20, 20, 30, 40);
  translate(width / 2, height / 2);
  let angle = frameCount * 3;
  push(); fill(60); noStroke();
  rect(-8, 80, 16, 120, 3); rect(-60, 180, 120, 20, 5); pop();
  push(); fill(80); stroke(120); strokeWeight(2);
  circle(0, 0, 40); fill(40); circle(0, 0, 16);
  fill(200, 180, 50); circle(0, 0, 6); pop();
  for (let i = 0; i < 4; i++) {
    push(); rotate(angle + i * 90);
    let hue = (frameCount * 0.5 + i * 90) % 360;
    fill(hue, 200, 255, 180); noStroke();
    beginShape(); vertex(0, 0);
    bezierVertex(30, -30, 100, -60, 130, -30);
    bezierVertex(140, -15, 130, 5, 90, 10);
    bezierVertex(50, 15, 15, 5, 0, 0); endShape(CLOSE);
    fill(255, 255, 255, 40);
    beginShape(); vertex(10, -5);
    bezierVertex(30, -25, 70, -40, 90, -25);
    bezierVertex(70, -20, 35, -10, 10, -5); endShape(CLOSE);
    pop();
  }
  push(); noFill();
  stroke(100, 200, 255, 30 + 20 * sin(frameCount * 2));
  strokeWeight(1);
  circle(0, 0, (130 + 10 * sin(frameCount * 1.5)) * 2);
  pop();
}`,
  '🌊 动态波浪': `let cols, rows;
let scl = 20;
let flying = 0;

function setup() {
  createCanvas(400, 400, WEBGL);
}

function draw() {
  background(10);
  flying -= 0.05;
  let yoff = flying;
  
  rotateX(PI / 3);
  translate(-width / 2, -height / 2);
  
  strokeWeight(1);
  for (let y = 0; y <= height; y += scl) {
    beginShape(TRIANGLE_STRIP);
    let xoff = 0;
    for (let x = 0; x <= width; x += scl) {
      let h = map(noise(xoff, yoff), 0, 1, -80, 80);
      let r = map(x, 0, width, 100, 255);
      let g = map(h, -80, 80, 50, 200);
      let b = map(y, 0, height, 255, 100);
      stroke(r, g, b, 180);
      vertex(x, y, h);
      xoff += 0.1;
      h = map(noise(xoff, yoff + 0.05), 0, 1, -80, 80);
      vertex(x, y + scl, h);
    }
    endShape();
    yoff += 0.1;
  }
}`,
  '✨ 粒子星云': `let particles = [];

function setup() {
  createCanvas(400, 400);
  for (let i = 0; i < 200; i++) {
    particles.push(new Particle());
  }
}

function draw() {
  background(10, 10, 20, 20);
  translate(width / 2, height / 2);
  for (let p of particles) {
    p.update();
    p.show();
  }
}

class Particle {
  constructor() {
    this.angle = random(TWO_PI);
    this.radius = random(50, 200);
    this.speed = random(0.002, 0.01);
    this.size = random(1, 4);
    this.hue = random(360);
  }
  update() {
    this.angle += this.speed;
    this.radius += random(-0.5, 0.5) * 0.3;
    this.radius = constrain(this.radius, 20, 220);
  }
  show() {
    let x = cos(this.angle) * this.radius;
    let y = sin(this.angle) * this.radius;
    let alpha = map(this.radius, 20, 220, 200, 50);
    colorMode(HSB, 360, 255, 255, 255);
    fill(this.hue, 200, 255, alpha);
    noStroke();
    circle(x, y, this.size);
    colorMode(RGB, 255);
  }
}`,
  '🎨 彩色螺旋': `function setup() {
  createCanvas(400, 400);
  colorMode(HSB, 360, 255, 255);
  noFill();
}

function draw() {
  background(10, 10, 10, 30);
  translate(width / 2, height / 2);
  
  let t = frameCount * 0.02;
  let n = 300;
  
  beginShape();
  for (let i = 0; i < n; i++) {
    let angle = i * radians(15) + t * 3;
    let r = 3 + i * 0.6 + 30 * sin(t + i * 0.05);
    let x = cos(angle) * r;
    let y = sin(angle) * r;
    stroke((i + frameCount) % 360, 200, 255, 150);
    strokeWeight(1.5);
    vertex(x, y);
    // 加小圆点
    point(x + cos(angle + 0.5) * 5, y + sin(angle + 0.5) * 5);
  }
  endShape();
}`
};

const DEFAULT_FAN_CODE = TEMPLATES['🌀 旋转风扇'];

function seedDefaultArtworks(artworks) {
  if (artworks.length > 0) return artworks;
  const defaults = [
    {
      id: genId(),
      name: '🌀 旋转风扇',
      description: '4片动态炫彩风扇，带拖尾效果和旋转光圈',
      code: DEFAULT_FAN_CODE,
      thumbnail: null,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    }
  ];
  saveData(defaults);
  return defaults;
}

function loadData() {
  try {
    let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    data = seedDefaultArtworks(data);
    return data;
  } catch(e) {
    const seeded = seedDefaultArtworks([]);
    return seeded;
  }
}

function saveData(artworks) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(artworks));
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// ============ State ============
const state = {
  artworks: [],
  currentId: null,
  currentCode: '',
  currentName: '',
  currentDesc: '',
  saved: true,
  view: 'gallery'
};

// ============ DOM Refs ============
const $ = (s) => document.querySelector(s);
const gallery = $('#gallery');
const editor = $('#editor');
const codeEditor = $('#codeEditor');
const nameInput = $('#nameInput');
const descInput = $('#descInput');
const previewFrame = $('#previewFrame');
const statusMsg = $('#statusMsg');
const lineCount = $('#lineCount');
const topbarLogo = $('#topbarLogo');
const topbarTitle = $('#topbarTitle');
const btnNew = $('#btnNew');
const btnBack = $('#btnBack');
const btnSave = $('#btnSave');
const btnDelete = $('#btnDelete');

// ============ Gallery ============
function loadGallery() {
  state.artworks = loadData();
  renderGallery();
}

function renderGallery() {
  if (state.artworks.length === 0) {
    gallery.innerHTML = `
      <div class="empty-state">
        <div class="icon">🎨</div>
        <div class="title">还没有作品</div>
        <div class="sub">点击「＋ 新建」创建第一个 p5.js 艺术作品</div>
      </div>`;
    return;
  }

  gallery.innerHTML = state.artworks.map(a => {
    const date = new Date(a.updatedAt);
    const timeAgo = formatTime(date);
    const thumbHtml = a.thumbnail
      ? `<div class="card-thumb"><img src="${a.thumbnail}" alt="预览" loading="lazy"></div>`
      : `<div class="card-thumb placeholder"><span>🎨</span></div>`;
    return `
      <div class="card" onclick="openEditor('${a.id}')">
        ${thumbHtml}
        <div class="name">${esc(a.name)}</div>
        <div class="desc">${esc(a.description || '暂无描述')}</div>
        <div class="meta">
          <span>${timeAgo}</span>
          <span style="color:var(--accent);font-size:11px">p5.js</span>
        </div>
        <div class="actions">
          <button class="btn-edit" onclick="event.stopPropagation(); openEditor('${a.id}')">✏️ 编辑</button>
          <button class="btn-edit" onclick="event.stopPropagation(); openViewer('${a.id}')">↗ 查看</button>
          <button class="btn-edit" onclick="event.stopPropagation(); cloneArtwork('${a.id}')">📋 克隆</button>
        </div>
      </div>`;
  }).join('');
}

function formatTime(d) {
  const now = new Date();
  const diff = now - d;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + '分钟前';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + '小时前';
  const days = Math.floor(hours / 24);
  if (days < 30) return days + '天前';
  return d.toLocaleDateString('zh-CN');
}

function esc(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function openViewer(id) {
  const art = state.artworks.find(a => a.id === id);
  if (!art) return;
  // Open viewer in new tab with data in localStorage
  const viewerKey = 'p5js_viewer_' + id;
  localStorage.setItem(viewerKey, JSON.stringify({
    name: art.name,
    code: art.code
  }));
  window.open('viewer.html?id=' + id, '_blank');
}

// ===== 导出 / 导入 =====
function exportJSON() {
  const data = loadData();
  const now = new Date();
  const stamp = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'p5js-artworks-' + stamp + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('数据格式错误');
      // Validate each item has required fields
      data.forEach((item, i) => {
        if (!item.id || typeof item.code !== 'string') {
          throw new Error('第 ' + (i + 1) + ' 项缺少 id 或 code 字段');
        }
      });
      const existing = loadData();
      const merged = state.view === 'editor'
        ? existing
        : []; // start fresh in gallery view
      const useMerge = state.view === 'editor' &&
        confirm('当前在编辑视图，选择「确定」合并导入（保留现有数据），「取消」则替换全部');
      const finalData = useMerge
        ? [...existing, ...data]
        : data;
      saveData(finalData);
      state.artworks = finalData;
      showGallery();
      loadGallery();
      showToast('✅ 导入成功，共 ' + finalData.length + ' 个作品');
    } catch(err) {
      alert('导入失败: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===== 克隆作品 =====
function cloneArtwork(id) {
  const art = state.artworks.find(a => a.id === id);
  if (!art) return;
  const clone = {
    id: genId(),
    name: art.name + ' (副本)',
    description: art.description,
    code: art.code,
    thumbnail: null,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  state.artworks.push(clone);
  saveData(state.artworks);
  renderGallery();
  showToast('📋 已克隆「' + art.name + '」');
}

// ===== 模板加载 =====
function loadTemplate(name) {
  const code = TEMPLATES[name];
  if (!code) return;
  codeEditor.value = code;
  state.currentCode = code;
  state.saved = false;
  updateStatus();
  updateLineCount();
  runPreview();
  showToast('📦 已加载模板: ' + name);
}

// ===== 全屏预览 =====
function toggleFullscreen() {
  const previewPanel = $('#previewPanel');
  if (previewPanel.classList.contains('fullscreen')) {
    previewPanel.classList.remove('fullscreen');
    document.body.style.overflow = '';
  } else {
    previewPanel.classList.add('fullscreen');
    document.body.style.overflow = 'hidden';
  }
}

// ===== Toast 消息 =====
function showToast(msg, duration) {
  duration = duration || 2000;
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.cssText = 'position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--surface2); color: var(--text); padding: 10px 20px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; z-index: 9999; box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: opacity 0.3s; opacity: 1;';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, duration);
}

// ============ Editor ============
let previewReady = false;

function openEditor(id) {
  const art = state.artworks.find(a => a.id === id);
  if (!art) return;
  
  state.currentId = art.id;
  state.currentCode = art.code;
  state.currentName = art.name;
  state.currentDesc = art.description || '';
  state.saved = true;
  
  nameInput.value = art.name;
  descInput.value = art.description || '';
  codeEditor.value = art.code;
  
  showEditor();
  navigateTo('?edit=' + id);
  updateLineCount();
  updateStatus();
  runPreview();
}

function createArtwork() {
  // Random default template
  const tmplNames = Object.keys(TEMPLATES);
  const defaultCode = tmplNames[Math.floor(Math.random() * tmplNames.length)];
  const art = {
    id: genId(),
    name: '未命名作品',
    description: '',
    code: TEMPLATES[defaultCode] || '',
    thumbnail: null,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  state.artworks.push(art);
  saveData(state.artworks);
  openEditor(art.id);
  renderGallery();
  showToast('🎨 已创建新作品（随机模板）');
}

function saveArtwork() {
  if (!state.currentId) return;
  
  state.currentName = nameInput.value.trim() || '未命名作品';
  state.currentDesc = descInput.value.trim();
  state.currentCode = codeEditor.value;
  
  const idx = state.artworks.findIndex(a => a.id === state.currentId);
  if (idx !== -1) {
    state.artworks[idx].name = state.currentName;
    state.artworks[idx].description = state.currentDesc;
    state.artworks[idx].code = state.currentCode;
    state.artworks[idx].updatedAt = new Date().toISOString();
    saveData(state.artworks);
  }
  
  state.saved = true;
  updateStatus();
  
  // Update gallery card
  renderGallery();
}

function deleteArtwork() {
  if (!state.currentId) return;
  if (!confirm('确定要删除「' + (state.currentName || '未命名作品') + '」吗？此操作不可撤销。')) return;
  
  state.artworks = state.artworks.filter(a => a.id !== state.currentId);
  saveData(state.artworks);
  state.currentId = null;
  showGallery();
  loadGallery();
}

// ===== View switching =====
function showGallery() {
  state.view = 'gallery';
  gallery.style.display = '';
  editor.classList.remove('active');
  btnNew.style.display = '';
  btnBack.style.display = 'none';
  topbarLogo.style.display = '';
  topbarTitle.style.display = 'none';
  document.title = '🎨 p5.js 作品集';
  navigateTo('.');
  renderGallery();
}

function showEditor() {
  state.view = 'editor';
  gallery.style.display = 'none';
  editor.classList.add('active');
  btnNew.style.display = 'none';
  btnBack.style.display = 'flex';
  topbarLogo.style.display = 'none';
  topbarTitle.style.display = 'inline';
  topbarTitle.textContent = '✏️ ' + state.currentName;
  document.title = '✏️ ' + state.currentName + ' | p5.js 作品集';
  previewFrame.src = 'preview-template.html';
  previewReady = false;
}

// ===== URL routing =====
function navigateTo(url) {
  history.pushState(null, '', url);
}

function initRouting() {
  const params = new URLSearchParams(window.location.search);
  const editId = params.get('edit');
  if (editId) {
    state.artworks = loadData();
    openEditor(editId);
  } else {
    loadGallery();
  }
}

window.addEventListener('popstate', () => {
  const params = new URLSearchParams(window.location.search);
  if (params.has('edit')) {
    state.artworks = loadData();
    openEditor(params.get('edit'));
  } else {
    showGallery();
    loadGallery();
  }
});

// ===== Viewer iframe communication =====
window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'ready' && state.view === 'editor') {
    previewReady = true;
    if (state.currentCode) sendCodeToEditorPreview();
  } else if (e.data.type === 'thumbnail' && e.data.dataUrl) {
    saveThumbnail(e.data.dataUrl);
  }
});

function saveThumbnail(dataUrl) {
  if (!state.currentId) return;
  const idx = state.artworks.findIndex(a => a.id === state.currentId);
  if (idx !== -1) {
    state.artworks[idx].thumbnail = dataUrl;
    saveData(state.artworks);
  }
}

// ===== Editor preview (embedded iframe) =====
function sendCodeToEditorPreview() {
  if (!previewReady) return;
  previewFrame.contentWindow.postMessage({
    type: 'run',
    code: state.currentCode
  }, '*');
}

function runPreview() {
  if (previewReady) sendCodeToEditorPreview();
}

previewFrame.addEventListener('load', () => {
  previewReady = false;
});

// ===== Status =====
function updateStatus() {
  if (state.saved) {
    statusMsg.textContent = '✅ 已保存';
    statusMsg.className = 'status saved';
    btnSave.style.opacity = '0.5';
  } else {
    statusMsg.textContent = '⚠ 未保存';
    statusMsg.className = 'status unsaved';
    btnSave.style.opacity = '1';
  }
}

function updateLineCount() {
  const lines = codeEditor.value.split('\n').length;
  lineCount.textContent = '行: ' + lines;
}

// ===== Event Handlers =====

btnNew.addEventListener('click', createArtwork);
btnBack.addEventListener('click', () => {
  if (!state.saved && state.view === 'editor') {
    if (!confirm('有未保存的更改，确定要返回吗？')) return;
  }
  showGallery();
  loadGallery();
});

$('#btnEditorBack')?.addEventListener('click', () => {
  if (!state.saved) {
    if (!confirm('有未保存的更改，确定要返回吗？')) return;
  }
  showGallery();
  loadGallery();
});

$('#btnExport')?.addEventListener('click', exportJSON);

$('#btnImport')?.addEventListener('click', () => {
  document.getElementById('importInput').click();
});

$('#btnEditorPreview')?.addEventListener('click', () => {
  saveArtwork();
  if (state.currentId) openViewer(state.currentId);
});

$('#btnFullscreen')?.addEventListener('click', toggleFullscreen);

$('#btnTemplate')?.addEventListener('click', () => {
  const names = Object.keys(TEMPLATES);
  const menu = document.createElement('div');
  menu.style.cssText = 'position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.5); min-width: 200px;';
  const btn = $('#btnTemplate');
  const rect = btn.getBoundingClientRect();
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.style.left = rect.left + 'px';
  menu.classList.add('template-menu');
  names.forEach(name => {
    const item = document.createElement('div');
    item.textContent = name;
    item.style.cssText = 'padding: 10px 16px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border); transition: background 0.15s;';
    item.onmouseenter = () => item.style.background = 'var(--surface2)';
    item.onmouseleave = () => item.style.background = '';
    item.onclick = () => {
      loadTemplate(name);
      menu.remove();
    };
    menu.appendChild(item);
  });
  document.body.appendChild(menu);
  // Close on click outside
  setTimeout(() => {
    document.addEventListener('click', function closeMenu(e) {
      if (!menu.contains(e.target) && e.target !== btn) {
        menu.remove();
        document.removeEventListener('click', closeMenu);
      }
    });
  }, 10);
});

btnSave.addEventListener('click', () => {
  saveArtwork();
  runPreview();
});

btnDelete.addEventListener('click', deleteArtwork);

$('#btnClearCode')?.addEventListener('click', () => {
  if (codeEditor.value.length > 0) {
    codeEditor.value = '';
    state.currentCode = '';
    state.saved = false;
    updateStatus();
    updateLineCount();
    runPreview();
    codeEditor.focus();
  }
});

$('#btnPasteCode')?.addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text) {
      codeEditor.value = text;
      state.currentCode = text;
      state.saved = false;
      updateStatus();
      updateLineCount();
      runPreview();
      codeEditor.focus();
    }
  } catch (err) {
    alert('粘贴失败，请手动 Ctrl+V 粘贴。错误: ' + err.message);
  }
});

$('#btnRefresh')?.addEventListener('click', () => {
  previewFrame.src = 'preview-template.html';
  previewReady = false;
  setTimeout(() => sendCodeToEditorPreview(), 500);
});

let previewTimer;
codeEditor.addEventListener('input', () => {
  state.saved = false;
  state.currentCode = codeEditor.value;
  updateStatus();
  updateLineCount();
  
  clearTimeout(previewTimer);
  previewTimer = setTimeout(runPreview, 800);
});

nameInput.addEventListener('input', () => {
  state.saved = false;
  state.currentName = nameInput.value;
  updateStatus();
  topbarTitle.textContent = '✏️ ' + (state.currentName || '未命名');
  document.title = '✏️ ' + (state.currentName || '未命名') + ' | p5.js 作品集';
});
descInput.addEventListener('input', () => {
  state.saved = false;
  state.currentDesc = descInput.value;
  updateStatus();
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    if (state.view === 'editor') {
      saveArtwork();
      runPreview();
    }
  }
  if (e.key === 'Escape' && state.view === 'editor') {
    showGallery();
    loadGallery();
  }
});

// Tab in code editor
codeEditor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = codeEditor.selectionStart;
    const end = codeEditor.selectionEnd;
    codeEditor.value = codeEditor.value.substring(0, start) + '  ' + codeEditor.value.substring(end);
    codeEditor.selectionStart = codeEditor.selectionEnd = start + 2;
    state.currentCode = codeEditor.value;
    state.saved = false;
    updateStatus();
  }
});

// Resize panels
let resizing = false;
const resizeHandle = $('#resizeHandle');
resizeHandle.addEventListener('mousedown', (e) => {
  resizing = true;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!resizing) return;
  const editorBody = $('.editor-body');
  const bodyRect = editorBody.getBoundingClientRect();
  const offset = e.clientX - bodyRect.left;
  const total = bodyRect.width;
  const pct = Math.max(15, Math.min(85, (offset / total) * 100));
  codePanel.style.flex = 'none';
  codePanel.style.width = pct + '%';
  $('#previewPanel').style.flex = '1';
});

document.addEventListener('mouseup', () => {
  if (resizing) {
    resizing = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
});

// ============ AI 修改 ============
const AI_STORAGE_KEY = '_p5ai_cfg';

// 简单混淆存储（base64 + 反转，防明文暴露）
function _enc(t) { return btoa(t.split('').reverse().join('')); }
function _dec(s) { try { return atob(s).split('').reverse().join(''); } catch(e) { return ''; } }

function loadAiConfig() {
  try {
    const raw = localStorage.getItem(AI_STORAGE_KEY);
    if (raw) return JSON.parse(_dec(raw));
  } catch(e) {}
  return { endpoint: 'https://api.deepseek.com/chat/completions', key: '', model: 'deepseek-chat' };
}

function saveAiConfig(cfg) {
  try { localStorage.setItem(AI_STORAGE_KEY, _enc(JSON.stringify(cfg))); } catch(e) {}
}

const aiOverlay = $('#aiOverlay');
const aiPrompt = $('#aiPrompt');
const aiStatus = $('#aiStatus');
const aiStatusText = $('#aiStatusText');
const aiGenerateBtn = $('#aiGenerateBtn');
const aiApplyBtn = $('#aiApplyBtn');
const aiDiffPreview = $('#aiDiffPreview');
const aiClose = $('#aiClose');
const aiEndpoint = $('#aiEndpoint');
const aiApiKey = $('#aiApiKey');
const aiModel = $('#aiModel');

let _aiGeneratedCode = null;

// Show AI dialog
$('#btnAiEdit')?.addEventListener('click', () => {
  // Load saved config into form fields
  const cfg = loadAiConfig();
  aiEndpoint.value = cfg.endpoint;
  aiApiKey.value = cfg.key;
  aiModel.value = cfg.model;

  aiPrompt.value = '';
  aiDiffPreview.classList.remove('show');
  aiApplyBtn.classList.remove('show');
  _aiGeneratedCode = null;
  aiStatus.className = 'ai-status';
  aiStatusText.textContent = cfg.key ? '就绪' : '⚠️ 请先设置 API Key';
  aiGenerateBtn.disabled = false;
  aiOverlay.classList.add('active');
  setTimeout(() => aiPrompt.focus(), 200);
});

// Close handlers
const closeAiDialog = () => {
  // 关闭时自动保存 API 设置
  saveAiConfig({
    endpoint: aiEndpoint.value.trim(),
    key: aiApiKey.value.trim(),
    model: aiModel.value.trim()
  });
  aiOverlay.classList.remove('active');
};
aiClose.addEventListener('click', closeAiDialog);
aiOverlay.addEventListener('click', (e) => {
  if (e.target === aiOverlay) closeAiDialog();
});

// Keyboard: Enter to submit, Escape to close
document.addEventListener('keydown', (e) => {
  if (!aiOverlay.classList.contains('active')) return;
  if (e.key === 'Escape') { closeAiDialog(); return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    aiGenerateBtn.click();
  }
});

// Generate
aiGenerateBtn.addEventListener('click', async () => {
  const prompt = aiPrompt.value.trim();
  if (!prompt) {
    aiStatus.className = 'ai-status error';
    aiStatusText.textContent = '⚠️ 请先输入修改方向';
    aiPrompt.focus();
    return;
  }

  const currentCode = codeEditor.value;
  if (!currentCode.trim()) {
    aiStatus.className = 'ai-status error';
    aiStatusText.textContent = '⚠️ 编辑器中没有代码';
    return;
  }

  // Loading
  aiGenerateBtn.disabled = true;
  aiApplyBtn.classList.remove('show');
  aiDiffPreview.classList.remove('show');
  _aiGeneratedCode = null;
  aiStatus.className = 'ai-status loading';
  aiStatusText.textContent = 'AI 正在思考...';

  const systemPrompt = `你是一个 p5.js 创意编程专家。

你的任务是根据用户的当前代码和修改要求，生成修改后的新代码。

规则：
1. 返回纯 JavaScript 代码，不要包含 markdown \`\`\` 代码块标记
2. 保持 p5.js 标准格式（function setup, function draw 等）
3. 除非明确要求 3D，否则使用 2D canvas（createCanvas 不带 WEBGL）
4. 给代码添加恰当的注释说明修改点
5. 保持代码风格一致，变量名清晰
6. 如果用户的修改要求不明确，给出合理的创意方向`;

  try {
    const endpoint = aiEndpoint.value.trim() || 'https://api.deepseek.com/chat/completions';
    const apiKey = aiApiKey.value.trim();
    const model = aiModel.value.trim() || 'deepseek-v4-flash';

    if (!apiKey) {
      aiStatus.className = 'ai-status error';
      aiStatusText.textContent = '⚠️ 请先设置 API Key（⚙️ API 设置）';
      aiGenerateBtn.disabled = false;
      return;
    }

    const response = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model: model,
        max_tokens: 4096,
        messages: [
          {
            role: 'system',
            content: systemPrompt
          },
          {
            role: 'user',
            content: `当前 p5.js 代码：
\`\`\`javascript
${currentCode}
\`\`\`

请根据以下要求修改代码：
${prompt}

请只返回完整的修改后代码，不要加额外说明。`
          }
        ]
      })
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error('API 错误 (' + response.status + '): ' + errText.slice(0, 200));
    }

    const data = await response.json();
    const generated = data.content?.[0]?.text || '';

    // Clean up markdown code fences if present
    let cleanCode = generated
      .replace(/^\`\`\`[\w]*\n?/, '')
      .replace(/\`\`\`\s*$/, '')
      .trim();

    if (!cleanCode) {
      throw new Error('AI 返回内容为空');
    }

    _aiGeneratedCode = cleanCode;

    // Show diff preview (truncated if too long)
    const previewText = cleanCode.length > 600
      ? cleanCode.slice(0, 600) + '\n\n... (代码较长，点击「应用代码」后完整替换)'
      : cleanCode;
    aiDiffPreview.textContent = previewText;
    aiDiffPreview.classList.add('show');
    aiApplyBtn.classList.add('show');

    // 成功后保存配置到本地存储
    saveAiConfig({ endpoint, key: apiKey, model });

    aiStatus.className = 'ai-status success';
    aiStatusText.textContent = '✅ 已生成，点击「应用代码」替换当前代码';
  } catch (err) {
    aiStatus.className = 'ai-status error';
    aiStatusText.textContent = '❌ ' + err.message;
  } finally {
    aiGenerateBtn.disabled = false;
    aiStatus.classList.remove('loading');
  }
});

// Apply generated code
aiApplyBtn.addEventListener('click', () => {
  if (!_aiGeneratedCode) return;
  codeEditor.value = _aiGeneratedCode;
  state.currentCode = _aiGeneratedCode;
  state.saved = false;
  updateStatus();
  updateLineCount();
  runPreview();
  closeAiDialog();
  showToast('🤖 AI 代码已应用');
  codeEditor.focus();
});

// ===== Init =====
initRouting();
</script>
</body>
</html>
